<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluctlight</title>
<script>
// The dashboard may be mounted under a path prefix by a reverse proxy, so
// every asset and API URL is relative to the page's own directory.
(function () {
  var b = document.createElement('base');
  b.href = location.pathname.replace(/\/?$/, '/');
  document.head.appendChild(b);
})();
</script>
<script type="importmap">
{
  "imports": {
    "three": "./{{ASSETS}}/vendor/three/three.module.min.js",
    "three/addons/": "./{{ASSETS}}/vendor/three/addons/",
    "marked": "./{{ASSETS}}/vendor/marked/marked.esm.js",
    "app/": "./{{ASSETS}}/"
  }
}
</script>
<link rel="stylesheet" href="{{ASSETS}}/fonts/fonts.css">
<link rel="stylesheet" href="{{ASSETS}}/theme.css">
<script type="module" src="{{ASSETS}}/app.js"></script>
</head>
<body>
<div id="stage" data-s="sky">
  <div id="gl" aria-hidden="true"></div>
  <div id="labels" aria-hidden="true"></div>

  <nav class="rail" aria-label="Main navigation">
    <div class="mark" aria-hidden="true"></div>
    <a class="ri on" data-r="sky" href="#sky" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><ellipse cx="12" cy="12" rx="8" ry="3"/><path d="M12 4v16"/></svg>SKY</a>
    <a class="ri" data-r="read" href="#read">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h9l5 5v11H5z"/><path d="M14 4v5h5M8 13h8M8 16h6"/></svg>READ</a>
    <a class="ri" data-r="sys" href="#sys">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>SYS</a>
  </nav>

  <!-- Sky overlays -->
  <header class="id" id="identity"></header>
  <section class="inf" id="inflow" aria-label="Inflow"></section>
  <div class="foot" id="foot"></div>
  <div class="q" id="query"></div>

  <!-- Global search / ask sheet (Tasks 9-10) -->
  <section class="sheet" id="sheet" hidden></section>

  <!-- Read drawer (Tasks 11-12) -->
  <section class="drawer" id="drawer" hidden></section>

  <!-- Sys page (Tasks 13-15) -->
  <section class="sys" id="sys" hidden></section>
</div>
</body>
</html>
