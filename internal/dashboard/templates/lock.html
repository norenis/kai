<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluctlight - Locked</title>
<script>
// Same as the shell: URLs are relative to the page's directory so the lock
// screen works under a reverse proxy path prefix.
(function () {
  var b = document.createElement('base');
  b.href = location.pathname.replace(/\/?$/, '/');
  document.head.appendChild(b);
})();
</script>
<link rel="stylesheet" href="{{ASSETS}}/fonts/fonts.css">
<link rel="stylesheet" href="{{ASSETS}}/theme.css">
<style>
body { display: flex; align-items: center; justify-content: center; }
.lockp { width: min(360px, 100vw - 48px); text-align: center; }
.lockp .mark { margin: 0 auto 26px; width: 40px; height: 40px; }
.lockp h1 { font: italic 500 40px/1 var(--serif); color: #f6efe0; }
.lockp .k { margin-top: 14px; }
.lockp .hr { margin: 22px auto 30px; width: 180px; background: linear-gradient(90deg, transparent, var(--gold-2), transparent); }
.lockp input {
  width: 100%; background: none; border: 0; border-bottom: 1px solid var(--gold-2); outline: none; padding: 8px 0 10px;
  font: 400 26px var(--sans); letter-spacing: .5em; text-align: center; color: var(--ink); caret-color: var(--gold);
}
.lockp input:focus { border-bottom-color: var(--gold); }
.lockp input.bad { border-bottom-color: var(--coral); }
.lockp .err { height: 14px; margin-top: 10px; color: var(--coral); }
.lockp .go, .lockp .sso {
  display: inline-block; margin-top: 18px; background: none; border: 0; border-bottom: 1px solid var(--gold-2); padding: 0 0 2px;
  cursor: pointer; text-decoration: none; font: italic 500 20px var(--serif); color: var(--gold);
}
.lockp .go:hover, .lockp .sso:hover { color: var(--champagne); }
.lockp .go:disabled { opacity: .5; cursor: default; }
.lockp .or { margin: 24px 0 0; }
</style>
</head>
<body>
<main class="lockp" aria-label="Authentication">
  <div class="mark" aria-hidden="true"></div>
  <h1>Fluctlight</h1>
  <div class="k">locked</div>
  <div class="hr"></div>
  <div id="pin-section">
    <label for="pin-input" class="sc" id="pin-hint">Enter PIN to continue</label>
    <input id="pin-input" type="password" maxlength="10" autofocus inputmode="numeric" autocomplete="off" aria-describedby="pin-hint pin-error">
    <div id="pin-error" class="sc err" role="alert" aria-live="assertive"></div>
    <button id="unlock-btn" class="go" type="button">Unlock</button>
  </div>
  <div id="sso-divider" class="sc or" hidden>or</div>
  <a id="sso-btn" class="sso" href="api/auth/oidc/login" hidden>Sign in with SSO</a>
</main>
<script>
const pin = document.getElementById('pin-input');
const btn = document.getElementById('unlock-btn');
const error = document.getElementById('pin-error');

async function submit() {
  error.textContent = '';
  pin.classList.remove('bad');
  btn.disabled = true;
  btn.textContent = 'Unlocking…';
  try {
    const resp = await fetch('api/auth', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({pin: pin.value})
    });
    if (resp.ok) {
      window.location.reload();
    } else {
      pin.classList.add('bad');
      error.textContent = 'Invalid PIN';
      pin.value = '';
      pin.focus();
    }
  } catch {
    error.textContent = 'Connection error';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Unlock';
  }
}

btn.addEventListener('click', submit);
pin.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });

(async function initAuthMethods() {
  try {
    const resp = await fetch('api/auth');
    const methods = await resp.json();
    if (methods.sso) {
      document.getElementById('sso-divider').hidden = !methods.pin;
      document.getElementById('sso-btn').hidden = false;
    }
    if (!methods.pin) {
      document.getElementById('pin-section').hidden = true;
    }
  } catch {
    // Auth-methods probe failed: fall back to the PIN-only UI already rendered.
  }
})();
</script>
</body>
</html>
